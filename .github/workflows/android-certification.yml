name: Android debug APK certification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: klm-android-certification
  cancel-in-progress: false
jobs:
  certify:
    if: github.event_name == 'workflow_dispatch'
    environment: android-certification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CERT_APPROVAL_ENVELOPE: ${{ secrets.KLM_CERTIFICATION_APPROVAL_ENVELOPE }}
      CERT_APPROVAL_PUBLIC_KEY: ${{ secrets.KLM_CERTIFICATION_APPROVAL_PUBLIC_KEY }}
      CERT_PROVENANCE_B64: ${{ secrets.KLM_CERTIFICATION_PROVENANCE_B64 }}
      GH_READ_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require independent approval and preprovisioned offline environment
        run: node tools/android-certification/verify.mjs --execution
      - name: Execute through Runtime authority
        run: node --import tsx tools/android-certification/certify.mts
      - name: Retain scoped evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: klm-android-certification-evidence
          path: ${{ runner.temp }}/klm-android-evidence/
          retention-days: 1
          if-no-files-found: warn
          include-hidden-files: false
      - name: Remove only job-owned local data
        if: always()
        run: node tools/android-certification/cleanup.mjs
